<div class="shell">
  <header class="shell__nav">
    <a class="shell__brand" routerLink="/">Linkly</a>
    <nav class="shell__links">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Acortar</a>
      <a routerLink="/mis-links" routerLinkActive="is-active">Mis links</a>
    </nav>
    <app-button variant="ghost" (click)="toggleTheme()">
      {{ theme.isDark() ? 'Modo claro' : 'Modo oscuro' }}
    </app-button>
  </header>

  <router-outlet></router-outlet>
</div>
