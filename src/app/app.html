<main class="showcase">
  <header class="showcase__head">
    <div>
      <p class="showcase__eyebrow">Linkly · Voltaje</p>
      <h1>Sistema base de componentes</h1>
    </div>
    <app-button variant="secondary" (click)="toggleTheme()">
      {{ theme.isDark() ? 'Modo claro' : 'Modo oscuro' }}
    </app-button>
  </header>

  <app-card>
    <div class="shorten">
      <app-input-field
        label="URL a acortar"
        type="url"
        placeholder="https://tu-sitio.com/una-url-eterna-y-dificil-de-recordar"
        [(value)]="url"
      />
      <app-select-field label="Expira" [options]="expirationOptions" [(value)]="expiration" />
      <app-button type="submit" [loading]="loading()" (click)="simulateShorten()">Acortar</app-button>
    </div>
  </app-card>

  <section class="variants">
    <app-card>
      <h2>Botones</h2>
      <div class="variants__row">
        <app-button>Primario</app-button>
        <app-button variant="secondary">Secundario</app-button>
        <app-button variant="ghost">Ghost</app-button>
        <app-button [disabled]="true">Deshabilitado</app-button>
      </div>
    </app-card>

    <app-card>
      <h2>Campo con error</h2>
      <app-input-field label="Alias personalizado" placeholder="mi-alias" error="Ese alias ya está en uso" />
    </app-card>
  </section>
</main>
